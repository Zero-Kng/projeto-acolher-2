# Configuracao nginx do container. Porte do .htaccess (Apache/KingHost) para
# nginx, com duas diferencas deliberadas, documentadas mais abaixo:
# o redirecionamento HTTPS e o HSTS.

server {
    listen      8080;
    listen [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ------------------------------------------------------------------
    # Cabecalhos de seguranca — equivalentes aos do .htaccess
    #
    # ATENCAO ao mexer aqui: no nginx, um `add_header` dentro de um bloco
    # `location` descarta TODOS os add_header herdados do bloco pai. Se
    # precisar de um cabecalho especifico em algum location, repita a lista
    # inteira ali dentro. Por isso o cache abaixo usa `expires` (que nao
    # dispara essa regra) em vez de `add_header Cache-Control`.
    # ------------------------------------------------------------------
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS: navegadores ignoram este cabecalho quando a resposta nao veio por
    # HTTPS, entao ele e inofensivo no container local e ja fica correto quando
    # a imagem rodar atras de um proxy com TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Mesmo CSP do .htaccess: sem 'unsafe-inline'. O site nao tem nenhum
    # <script> inline nem atributo style= — se alguem adicionar um, ele sera
    # bloqueado aqui e no ar. O smoke test em scripts/smoke-test.sh cobre isso.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # O redirecionamento HTTP->HTTPS do .htaccess NAO tem equivalente aqui de
    # proposito: dentro do container nao existe TLS. Quem termina TLS e o proxy
    # / a hospedagem na frente. Duplicar o redirect aqui causaria loop infinito.

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # HTML e JSON nunca sao cacheados: content/*.json e editado direto pela
    # equipe e precisa refletir na hora.
    location ~* \.(?:html|json)$ {
        expires -1;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
    }

    # Arquivos ocultos (.git, .htaccess, .env) nunca sao servidos.
    location ~ /\. {
        deny all;
    }

    # Endpoint de liveness para o HEALTHCHECK e para orquestradores.
    # Usa default_type em vez de add_header justamente para nao derrubar
    # os cabecalhos de seguranca herdados.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
